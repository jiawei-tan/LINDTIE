# Parameters for the workflow
# Assembly Mode: 'hybrid', 'denovo', 'denovo_subset', or 'ref_guided'
assembly_mode: 'hybrid'

# Tool Presets
# minimap2 presets (passed to -ax):
#   'map-ont' : Oxford Nanopore genomic reads (default)
#   'map-pb'  : PacBio CLR genomic reads
#   'map-hifi': PacBio HiFi/CCS genomic reads (v2.19+)
#   'lr:hq'   : Nanopore Q20 genomic reads (v2.27+)
minimap2_preset: 'map-ont'

# rnabloom2 presets:
#   ''       : Leave empty for ONT (default)
#   '-lrpb'  : For PacBio
rnabloom2_preset: ''

subset_count: null               # NULL for no subsetting, otherwise the number of reads to subset to
detect_viral_integration: false  # true or false (default: false)
RUN_DE: true                     # true or false (default: true)
fdr: 0.05                        # default 0.05
min_cpm: 0.5                     # default 0.5
min_logfc: 2                     # default 2
min_clip: 20                     # default 20
min_gap: 7                       # default 7
min_match: '30,0.3'              # default '30,0.3'
splice_motif_mismatch: 1         # default 1
oarfish_num_bootstraps: 10       # default 10
oarfish_growth_rate: 0.5         # oarfish -k; default 0.5
gene_filter: NULL                # default NULL (e.g. "TP53,BRCA2")
var_filter: NULL                 # default NULL (e.g. "DEL,INS")
single_sample_min_vaf: 0.1       # default 0.1
single_sample_cosmic_filter: true # true or false (default: true)
max_fisher_p_val: 0.05           # default 0.05

# Alignment-based supporting-read counting (count_supporting_reads)
supp_read_window: 300            # bp either side of a breakpoint to fetch candidate reads
supp_read_min_anchor: 20         # min aligned bp on the REFERENCE side of a boundary (THROUGH/INTERIOR/INSIDE)
supp_read_through_depth: 100     # bp a read must stay aligned INTO the novel segment: min(segment, this)
supp_read_min_gap: 25            # merge alignment gaps <= this (absorb ONT indel noise)
supp_read_gap_merge: 30          # merge D/N ops separated by <= this when matching a splice/deletion gap
supp_read_tol: 35                # max breakpoint position tolerance (tightened per gap size)
supp_read_bp_tol: 10             # breakpoint tolerance for a clip position (UN)
supp_read_near_canonical: 10     # variant junction within this of an annotated junction -> reliability=low
supp_read_min_clip: 25           # min soft/hard-clip length at the breakpoint for UN support
supp_read_inside_window: 250     # bp past the counted junction to look for spliced-in reads (NE/EE)
supp_read_ins_tol: 100           # position tolerance for a CIGAR insertion / large soft-clip (INS/ITD/PTD)
supp_read_split_tol: 20000       # max bp between a split read's supplementary alignment (either end) and pos2 (FUS/IGR)

# Paths to the input files (note: ${projectDir} refers to the directory containing main.nf)
code_base: "${projectDir}/modules/code_base"
cases_fastq_dir: './cases'
controls_fastq_dir: './controls'
trans_fasta: "${projectDir}/ref/chess3.0_with_HTLV1_HPV_HBV_HIV1_HIV2_EBV.fa"
tx_annotation: "${projectDir}/ref/chess3.0_with_HTLV1_HPV_HBV_HIV1_HIV2_EBV.gtf"
ann_info: "${projectDir}/ref/chess3.0_with_HTLV1_HPV_HBV_HIV1_HIV2_EBV.info"
tx2gene: "${projectDir}/ref/tx2gene.txt"
hg38_fasta: "${projectDir}/ref/hg38_with_HTLV1_HPV_HBV_HIV1_HIV2_EBV.fa"
hg38_splice_junctions: "${projectDir}/ref/hg38_splice_junctions.bed"
cosmic_tier_data: "${projectDir}/ref/Cosmic_CancerGeneCensus_v103_GRCh38_tier_fusion.tsv"